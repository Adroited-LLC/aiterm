          ],
          trace_status: false,
          trace_set: null,
          diag_log_path: "/home/matt/.local/share/aiterm/aiterm.log",
          diag_log_tail: "12:00:01 preview harness — nothing real below\n12:00:02 settings modal visual check",
          diag_environment: [
            ["aiterm", "0.10.13 (preview)"],
            ["webview", "WebKitGTK (browser preview)"],
            ["config", "~/.config/aiterm"],
          ],
          agent_choices: [
            { id: "claude", display_name: "Claude Code", models: [], mints_session_id: true },
          ],
          detect_agents: [
            { id: "claude", display_name: "Claude Code", available: true, version: "2.1.220", path: "/home/matt/.local/bin/claude" },
            { id: "codex", display_name: "Codex CLI", available: false, version: null, path: null },
          ],
          // Cheap enough to gate a render on, so every capability check in the

          agent_caps: {
            claude: { fork: true, clear: true, resume: true, tui_drive: true, panels: true },

            { name: "Cantarell", mono: false },
            { name: "JetBrains Mono", mono: true },

          font_packages: [
            { package: "jetbrains-mono-fonts", name: "JetBrains Mono", note: "tall x-height, clear 0O 1lI", installed: true },
            { package: "fira-code-fonts", name: "Fira Code", note: "ligatures for => and !==", installed: false },

          ],
          git_repo_state: { is_repo: false, branch: null, ahead: 0, behind: 0, dirty: 0 },
          pty_spawn: 1,
          // Every tab now opens on a plan, so the harness has to answer this
          // or the paths that start one throw.
          resolve_launch: {
            command: "echo 'launch plan (preview)'",
            env_provider: null,
            session_id: "00000000-0000-4000-8000-000000000000",
            agent_id: "claude",
            caps: { fork: true, clear: true, resume: true, tui_drive: true, panels: true },
          },
          claude_model_default: null,
          claude_permission_mode: null,
          watch_project: null,
        };
        let cb = 1;
        window.__TAURI_INTERNALS__ = {
          transformCallback(callback) {
            const id = cb++;
            window["_" + id] = callback;
            return id;
          },
          invoke(cmd) {
            if (cmd in mocks) return Promise.resolve(mocks[cmd]);
            if (cmd.startsWith("plugin:")) return Promise.resolve(null);
            return Promise.resolve(null);
          },
          metadata: { currentWindow: { label: "main" }, currentWebview: { label: "main" } },
        };
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
