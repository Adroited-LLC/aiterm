[package]
name = "aiterm-wsl-backend"
version = "0.1.0"
edition = "2021"

[features]
default = ["wsl-headless"]
wsl-headless = []

[dependencies]
aiterm-wsl-protocol = { path = "../wsl-protocol" }
portable-pty = "0.9.0"
base64 = "0.22"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
git2 = { version = "0.21", default-features = false }
dirs = "6"
pollster = "0.4"
comrak = { version = "0.54", default-features = false }
