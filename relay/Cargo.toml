[package]
name = "aiterm-relay"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
aiterm-relay-protocol = { path = "../relay-protocol" }
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time", "io-util", "signal"] }

[dev-dependencies]
tokio-tungstenite = "0.29"
