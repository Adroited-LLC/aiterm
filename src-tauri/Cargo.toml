[package]
name = "aiterm"
version = "0.10.45"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "aiterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
# preserve_order: rewriting a settings file must not reorder the keys the user
# put there. Without it serde_json sorts them alphabetically on the way out.
serde_json = { version = "1", features = ["preserve_order"] }
portable-pty = "0.9.0"
git2 = "0.21.0"
dirs = "6.0.0"
tantivy = "0.26"
tauri-plugin-window-state = "2.4.1"
notify = "8.2.0"
libc = "0.2"
# Session ids are minted in Rust, not the renderer: only the backend knows
# whether an id will name a real session. Already in the tree via Tauri, so
# this turns on a feature rather than adding a dependency.
uuid = { version = "1", features = ["v4"] }
tauri-plugin-dialog = "2"
# No `release_max_level_off`: the Diagnostics panel can switch tracing on in
# release builds, so the macros must survive into them. Off = a cached filter
# check per event site, which is the cost of having the switch at all.
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "registry", "fmt"] }

